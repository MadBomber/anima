# MkDocs Configuration for Anima Documentation
site_name: Anima
site_description: An AI agent built on biology, not chat — local Rails app with autonomous capabilities
site_author: Yevhenii Gurin
site_url: https://hoblin.github.io/anima
copyright: Copyright &copy; 2025 Yevhenii Gurin

# Repository information
repo_name: hoblin/anima
repo_url: https://github.com/hoblin/anima
edit_uri: edit/main/docs/

# Configuration
theme:
  name: material

  # Color scheme
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Typography
  font:
    text: Roboto
    code: Roboto Mono

  # Logo and icon
  icon:
    repo: fontawesome/brands/github
    logo: material/brain

  # Theme features
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()`"/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page

  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: hoblin
      repo: anima
      normalize_issue_symbols: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra CSS
extra_css:
  - assets/css/custom.css

# Social media and extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hoblin/anima
      name: Anima on GitHub
    - icon: fontawesome/solid/gem
      link: https://rubygems.org/gems/anima-core
      name: Anima on RubyGems

  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback! Help us improve by creating an issue.

# Navigation
nav:
  - Home:
      - Overview: index.md
      - Status: status.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Configuration: getting-started/configuration.md
      - Authentication: getting-started/authentication.md
  - Architecture:
      - architecture/index.md
      - Event System: architecture/event-system.md
      - Context as Viewport: architecture/context-viewport.md
      - Agent Loop: architecture/agent-loop.md
      - Analytical Brain: architecture/analytical-brain.md
      - Brain as Microservices: architecture/brain-microservices.md
      - TUI View Modes: architecture/tui-view-modes.md
  - Capabilities:
      - capabilities/index.md
      - Tools: capabilities/tools.md
      - Skills: capabilities/skills.md
      - Workflows: capabilities/workflows.md
      - Sub-Agents: capabilities/sub-agents.md
      - MCP Integration: capabilities/mcp-integration.md
  - Vision:
      - vision/index.md
      - Hormonal System (Thymos): vision/thymos.md
      - Semantic Memory (Mneme): vision/mneme.md
      - Soul Matrix (Psyche): vision/psyche.md
  - Development:
      - development/index.md
      - Project Structure: development/project-structure.md
      - Running Tests: development/testing.md
      - Contributing: development/contributing.md
